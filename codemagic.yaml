# Optional: Codemagic Build für iPhone / TestFlight
#
# Noch NICHT aktiv verdrahtet – Vorlage für später.
# Braucht Apple Developer Konto + App Store Connect API Key.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: de.rezeptezumnachkochen.rezeptNachkochen
      # secrets später setzen:
      # APP_STORE_CONNECT_ISSUER_ID
      # APP_STORE_CONNECT_KEY_IDENTIFIER
      # APP_STORE_CONNECT_PRIVATE_KEY
      # CERTIFICATE_PRIVATE_KEY
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
