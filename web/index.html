<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rezeptvideos teilen und als Einkaufsliste plus Schritt-für-Schritt-Anleitung nachkochen.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iPhone: wie eine App auf dem Home-Bildschirm -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezept Nachkochen">
  <meta name="theme-color" content="#2F6F4E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google-Anmeldung: Client-ID wird zur Laufzeit gesetzt (Einstellungen → Google-Backup).
       Optional hier fest eintragen: content="DEINE_ID.apps.googleusercontent.com" -->
  <meta name="google-signin-client_id" content="">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Rezept Nachkochen</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Verhindert Blinken beim Start auf dem iPhone */
    html, body {
      height: 100%;
      margin: 0;
      background: #F7F3E8;
    }
  </style>
</head>
<body>
  <!-- PWA: alte Caches leeren + Update-Hilfe (vor Flutter laden) -->
  <script src="pwa_boot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
